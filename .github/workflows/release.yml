name: Release

# Push a tag like v0.2.0 to build RBRInputManager.exe and publish it as a GitHub release.
# The in-app updater picks up the latest non-prerelease release that has this exe attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/RBRInputManager/RBRInputManager.csproj -c Release -o publish -p:Version=$version

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/RBRInputManager.exe
          generate_release_notes: true
